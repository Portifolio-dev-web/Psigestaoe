services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: psigestao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d psigestao"]
      interval: 10s
      timeout: 20s
      retries: 5

  api:
    build: ./backend
    # Desenvolvimento: aplica as migrações (prestart.py, o mesmo da produção)
    # e sobe UM processo com recarga automática ao salvar arquivos.
    # A imagem, por padrão, sobe em modo de PRODUÇÃO (start.sh: migração +
    # gunicorn com vários workers); este comando substitui isso só aqui.
    command: sh -c "python prestart.py && uvicorn server:app --host 0.0.0.0 --port 5000 --reload"
    env_file:
      - .env
      - ./backend/.env
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:adminpassword@db:5432/psigestao
      JWT_SECRET: ${JWT_SECRET}
      # Chave dos campos criptografados (CPF, RG, endereço, prontuários).
      # Precisa ser uma chave Fernet válida e NÃO pode ser perdida: sem ela os prontuários ficam ilegíveis.
      FERNET_KEY: ${FERNET_KEY}
      FERNET_OLD_KEYS: ${FERNET_OLD_KEYS:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true

volumes:
  postgres_data: