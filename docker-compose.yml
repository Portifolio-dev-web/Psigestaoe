services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      # SEGURANÇA (varredura, itens 1 e 16): a senha ficava escrita aqui, e
      # portanto no git ("adminpassword"). Agora vem do .env da raiz, que fica
      # fora do git, e o compose se recusa a subir se ela não estiver definida.
      # Atenção: o Postgres só lê esta variável ao criar o volume pela primeira
      # vez. Para trocar a senha de um banco que já existe, veja o README.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env da raiz (veja .env.example)}
      POSTGRES_DB: psigestao
    ports:
      # SEGURANÇA (varredura, item 16): "5432:5432" publicava o banco em
      # 0.0.0.0, isto é, para qualquer aparelho da mesma rede (Wi-Fi, rede
      # local). Com 127.0.0.1 só esta máquina acessa; ferramentas como
      # DBeaver ou pgAdmin continuam funcionando em localhost:5432.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d psigestao"]
      interval: 10s
      timeout: 20s
      retries: 5

  api:
    build: ./backend
    # Desenvolvimento: aplica as migrações (prestart.py, o mesmo da produção)
    # e sobe UM processo com recarga automática ao salvar arquivos.
    # A imagem, por padrão, sobe em modo de PRODUÇÃO (start.sh: migração +
    # gunicorn com vários workers); este comando substitui isso só aqui.
    # Segurança (varredura, item 12): --no-server-header tira o cabeçalho
    # "server: uvicorn" das respostas (em produção: gunicorn.conf.py).
    command: sh -c "python prestart.py && uvicorn server:app --host 0.0.0.0 --port 5000 --reload --no-server-header"
    env_file:
      - .env
      - ./backend/.env
    ports:
      # SEGURANÇA (varredura, item 16): a API de desenvolvimento (com /docs
      # aberto) fica acessível só nesta máquina. O ngrok continua funcionando,
      # porque roda aqui e encaminha para localhost:5000.
      - "127.0.0.1:5000:5000"
    environment:
      # Mesma senha do serviço db, vinda do .env da raiz (nada fixo aqui).
      DATABASE_URL: postgresql+asyncpg://admin:${POSTGRES_PASSWORD}@db:5432/psigestao
      JWT_SECRET: ${JWT_SECRET}
      # Chave dos campos criptografados (CPF, RG, endereço, prontuários).
      # Precisa ser uma chave Fernet válida e NÃO pode ser perdida: sem ela os prontuários ficam ilegíveis.
      FERNET_KEY: ${FERNET_KEY}
      FERNET_OLD_KEYS: ${FERNET_OLD_KEYS:-}
      # SEGURANÇA (varredura, item 5): sem ENVIRONMENT, o servidor agora assume
      # PRODUÇÃO (backend/environment.py). Este arquivo é só de
      # desenvolvimento, então declara "development" explicitamente.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      WATCHFILES_FORCE_POLLING: "true"
      # Segurança média: e-mails do desenvolvimento (cadastro, "Esqueci minha
      # senha", avisos) vão para o Mailpit, uma caixa de entrada de mentira:
      # nada sai para a internet. Veja em http://localhost:8025.
      MAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
      SMTP_USERNAME: ""
      SMTP_FROM: "PsiGestão <nao-responda@psigestao.local>"
      # Produto (assinatura): no desenvolvimento, o pagamento é SIMULADO (a tela
      # /assinatura/simulacao tem os botões Pagar e Recusar, e Configurações >
      # Assinatura tem as ferramentas de teste). Em produção a API recusa "simulado".
      BILLING_PROVIDER: ${BILLING_PROVIDER:-simulado}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Segurança média: servidor de e-mail SÓ de desenvolvimento. Recebe tudo o
  # que a API envia e mostra numa página (http://localhost:8025), sem entregar
  # nada a ninguém. Em produção a API usa um SMTP de verdade (ver .env.example).
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      # Só nesta máquina, como os demais serviços.
      - "127.0.0.1:8025:8025"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Segurança (varredura, Fase 7): o Dockerfile do frontend tem estágios.
      # Aqui usamos o de desenvolvimento (yarn start, recarga automática); o
      # de produção ("production") é o nginx com os arquivos estáticos.
      target: dev
    ports:
      # SEGURANÇA (varredura, item 16): o servidor de desenvolvimento do React
      # fica acessível só nesta máquina, como a API e o banco.
      - "127.0.0.1:3000:3000"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true

volumes:
  postgres_data: