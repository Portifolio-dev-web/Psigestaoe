<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- Complementares: o favicon.ico referenciado não existia (aba sem ícone).
         SVG para navegadores atuais; ICO e PNG para os demais e para a tela
         inicial do celular. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E3A8A" />
    <meta name="description" content="PsiGestão — Gestão Clínica e Prontuários de Psicologia" />
    <!-- Fontes: servidas pelo próprio app (src/index.js), não mais pelo Google Fonts. -->
    <title>PsiGestão — Prontuários de Psicologia</title>

    <!-- DEPLOY (varredura, item D3): sem isso, um link do PsiGestão colado no
         WhatsApp/Slack (ex.: o link de cadastro mandado ao paciente, ou a
         própria tela de login) aparecia sem nenhum preview. Site inteiro
         atrás de login, então isso não é SEO de conteúdo (o Google não indexa
         o que exige senha) — é só a prévia do link em si.
         og:image usa caminho relativo (resolve pela própria origem de quem
         compartilhou, igual a todo o resto do app — nunca um domínio fixo
         aqui). og:url PRECISA do domínio final; preencha ao decidir onde o
         site vai morar (ver README, "Endereços do deploy"). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PsiGestão" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="PsiGestão — Prontuários de Psicologia" />
    <meta property="og:description" content="Gestão clínica e prontuários de Psicologia, com criptografia e conformidade com o CFP e a LGPD." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PsiGestão — Gestão clínica e prontuários de Psicologia" />
    <!-- <meta property="og:url" content="https://SEU-DOMINIO-AQUI" /> -->

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PsiGestão — Prontuários de Psicologia" />
    <meta name="twitter:description" content="Gestão clínica e prontuários de Psicologia, com criptografia e conformidade com o CFP e a LGPD." />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />
  </head>
  <body>
    <noscript>Você precisa habilitar o JavaScript para usar este aplicativo.</noscript>
    <div id="root"></div>
  </body>
</html>
