# frontend/nginx.conf
# ---------------------------------------------------------------------------
# Servidor do frontend em PRODUÇÃO (SEGURANÇA, varredura itens 12, 13 e 16).
#
# Antes a "produção" do frontend era o servidor de DESENVOLVIMENTO do React
# (yarn start): código-fonte legível no navegador (source maps), recarga
# automática, cabeçalho "X-Powered-By: Express", nenhum cabeçalho de
# segurança e uma falha conhecida de path traversal no webpack-dev-middleware.
#
# Agora o nginx serve SÓ os arquivos estáticos gerados pelo `yarn build`:
#   - cabeçalhos de segurança da interface (CSP, proteção contra iframe...);
#   - nenhuma versão do servidor nas respostas (server_tokens off);
#   - cache longo para arquivos com hash no nome; index.html sempre revalidado;
#   - qualquer rota do app (/pacientes/123) devolve o index.html (SPA).
#
# __API_ORIGIN__ é trocado no build da imagem (Dockerfile) pela origem da API,
# a mesma de REACT_APP_BACKEND_URL: a CSP só deixa a página falar com ela.
# ---------------------------------------------------------------------------
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Não anuncia a versão do nginx (ajudaria quem procura uma falha conhecida).
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- Cabeçalhos de segurança ---------------------------------------------
    # "always": valem também para respostas de erro.
    # ATENÇÃO (regra do nginx): um add_header dentro de um `location` faz o
    # bloco IGNORAR todos estes. Por isso os locations abaixo usam `expires`
    # (que não tem esse efeito) em vez de add_header.
    #
    # CSP (Content-Security-Policy): a lista do que a página pode carregar.
    # Mesmo que um dia entre um XSS (texto malicioso executado como código),
    # o navegador recusa scripts de qualquer outra origem, scripts embutidos
    # no HTML e envio de dados para endereços fora da lista.
    #   script-src  só os arquivos do próprio app + o script do login com Google;
    #   style-src   'unsafe-inline' porque componentes da interface (ex.: os
    #               avisos) injetam estilos; estilo não executa código;
    #   font-src    só as fontes do próprio app (antes também o Google Fonts,
    #               que recebia o IP de cada usuário; complementares);
    #   connect-src só a API e o Google (login);
    #   frame-src   só o botão/janela de login do Google;
    #   frame-ancestors 'none': nenhum site exibe o app dentro de um iframe.
    #
    # DEPLOY (varredura, item I2): ao ligar o Sentry do frontend
    # (REACT_APP_SENTRY_DSN em frontend/.env — ver lib/sentry.js), o navegador
    # passa a mandar erros para o domínio de ingestão do seu projeto Sentry
    # (ex.: https://o000000.ingest.us.sentry.io). Sem acrescentar esse domínio
    # aqui em connect-src, o PRÓPRIO CSP bloqueia o envio (silenciosamente: a
    # tela continua funcionando, só o relatório de erro não sai).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self'; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' __API_ORIGIN__ https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Clickjacking em navegadores antigos que não entendem frame-ancestors.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Outros sites recebem só a origem, nunca o endereço completo (que pode ter
    # o ID de um paciente). Não usamos "no-referrer": o login do Google precisa da origem.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Isola a janela do app; "allow-popups" mantém funcionando o popup do login do Google.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # Só HTTPS com este domínio por 2 anos (o navegador ignora se a resposta vier por HTTP).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Verificação de saúde do container (HEALTHCHECK do Dockerfile).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Arquivos com hash no nome (static/js/main.1a2b3c.js): mudam de nome a cada
    # deploy, então podem ficar 1 ano em cache. Arquivo inexistente aqui = 404
    # (e não o index.html, que confundiria o navegador com HTML no lugar de JS).
    location /static/ {
        expires 1y;
        try_files $uri =404;
    }

    # Nenhum arquivo oculto (.env, .git...) é servido, mesmo que entre na imagem por engano.
    location ~ /\. {
        deny all;
    }

    # Rotas do app (React Router): qualquer caminho devolve o index.html, sempre
    # revalidado, para um novo deploy aparecer na hora.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
